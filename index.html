<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일상생활 시뮬레이터</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">일상생활 <em>시뮬레이터</em></span>
    </h1>
    <div id="legend" class="legend"></div>
    <nav class="step-nav" aria-label="입력 단계">
      <button id="house-open" type="button" class="step-btn" aria-controls="drawer">
        <span class="step-no">1</span><span class="step-name">집 구조</span><span id="house-summary" class="summary"></span>
      </button>
      <button id="sched-open" type="button" class="step-btn" aria-controls="drawer">
        <span class="step-no">2</span><span class="step-name">동선</span><span id="sched-summary" class="summary"></span>
      </button>
    </nav>
  </header>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="입력" aria-hidden="true">
    <div class="drawer-head">
      <div class="tabs" role="tablist">
        <button id="house-tab" type="button" role="tab" class="tab"><span class="step-no">1</span>집 구조</button>
        <button id="sched-tab" type="button" role="tab" class="tab"><span class="step-no">2</span>동선</button>
      </div>
      <button id="drawer-close" type="button" class="icon-btn" aria-label="닫기">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <section id="house-panel" class="drawer-panel" role="tabpanel">
      <div class="drawer-body">
        <div class="field">
          <div class="field-label"><span class="field-no">1</span>OOC</div>
          <div class="prompt-card">
            <span class="prompt-desc">복사해서 롤플레이 채팅에 보내세요</span>
            <button id="btn-house-copy" type="button" class="btn-soft">OOC 복사</button>
          </div>
        </div>
        <div class="field grow">
          <label class="field-label" for="house-input"><span class="field-no">2</span>AI 답변 붙여넣기</label>
          <textarea id="house-input" spellcheck="false" placeholder="[HOUSE]
주거 형태: 2층 단독주택
층수: 지상 2층

[ROOMS]
• 거실 | 1층 | 남쪽 중앙 | 소파와 TV
• 침실 | 2층 | 동쪽 | 침대

[CONNECTIONS]
• 거실 | 침실 | 실내 계단"></textarea>
        </div>
        <div id="house-messages" class="messages" hidden></div>
      </div>
      <div class="drawer-foot">
        <button id="btn-house-demo" type="button" class="btn-ghost demo-btn" title="예시 집과 하루 동선을 채워서 바로 생성">예시 불러오기</button>
        <button id="btn-house-clear" type="button" class="btn-ghost">지우기</button>
        <button id="btn-house-generate" type="button" class="primary">집 생성</button>
      </div>
    </section>

    <section id="sched-panel" class="drawer-panel" role="tabpanel" hidden>
      <div class="drawer-body">
        <div class="field">
          <div class="field-label"><span class="field-no">1</span>캐릭터 <span class="field-hint">동그라미는 색, 오른쪽은 이미지(선택)</span></div>
          <div class="char-fields">
            <div class="char-field">
              <input id="char-color-a" class="swatch" type="color" value="#f06292" aria-label="PC 색상" title="PC 색상">
              <input id="char-name-a" type="text" maxlength="20" placeholder="PC 이름" autocomplete="off" aria-label="PC 이름">
              <button type="button" class="avatar-btn" data-slot="0" title="PC 이미지 넣기 (PNG)" aria-label="PC 이미지 넣기">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M4 17l5-4.5 3.5 3 3-2.5L20 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              </button>
              <button type="button" class="avatar-clear" data-slot="0" title="이미지 빼고 동그라미로" aria-label="PC 이미지 빼기" hidden>
                <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              </button>
              <input type="file" class="avatar-file" data-slot="0" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            </div>
            <div class="char-field">
              <input id="char-color-b" class="swatch" type="color" value="#5688e8" aria-label="NPC 색상" title="NPC 색상">
              <input id="char-name-b" type="text" maxlength="20" placeholder="NPC 이름" autocomplete="off" aria-label="NPC 이름">
              <button type="button" class="avatar-btn" data-slot="1" title="NPC 이미지 넣기 (PNG)" aria-label="NPC 이미지 넣기">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M4 17l5-4.5 3.5 3 3-2.5L20 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
              </button>
              <button type="button" class="avatar-clear" data-slot="1" title="이미지 빼고 동그라미로" aria-label="NPC 이미지 빼기" hidden>
                <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
              </button>
              <input type="file" class="avatar-file" data-slot="1" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            </div>
          </div>
        </div>
        <div class="field">
          <div class="field-label"><span class="field-no">2</span>OOC <span class="field-hint">답이 끊기지 않게 세 번에 나눠 받아요</span></div>
          <div id="sched-parts" class="part-row"></div>
          <p id="sched-prompt-desc" class="prompt-note" hidden>집을 먼저 생성하세요</p>
        </div>
        <div class="field grow">
          <label class="field-label" for="sched-input"><span class="field-no">3</span>AI 답변 붙여넣기 <span class="field-hint">받은 순서대로 이어서</span></label>
          <textarea id="sched-input" spellcheck="false" placeholder="[CHARACTERS]
CHARACTER: PC | name=유저 | color=#F06292
CHARACTER: NPC | name=상대 | color=#5688E8

[SCHEDULE]
07:00 | PC | 기상 | 침실 | (벌써 아침이네)
07:05 | PC | 거실로 이동 | 침실>거실 | 좋은 아침"></textarea>
        </div>
        <div id="sched-messages" class="messages" hidden></div>
      </div>
      <div class="drawer-foot">
        <button id="btn-sched-clear" type="button" class="btn-ghost">지우기</button>
        <button id="btn-sched-generate" type="button" class="primary" disabled>동선 생성</button>
      </div>
    </section>
  </aside>

  <main class="layout">
    <section class="card map-card">
      <div class="card-head">
        <div class="card-title">
          <h2>집 지도</h2>
          <span id="house-kind" class="card-meta"></span>
        </div>
        <div id="floor-tabs" class="floor-tabs" role="tablist" aria-label="층 선택" hidden></div>
        <div class="zoom-row">
          <button id="zoom-out" type="button" class="icon" aria-label="축소" title="축소" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <span id="zoom-level" class="zoom-level">100%</span>
          <button id="zoom-in" type="button" class="icon" aria-label="확대" title="확대" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <button id="zoom-fit" type="button" class="icon" aria-label="화면 맞춤" title="화면 맞춤" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="map-stage">
        <div id="map-wrap" class="map-wrap">
          <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="집 지도"></svg>
          <div id="map-empty" class="empty">
            <div class="empty-inner">
              <span class="empty-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="28" height="28"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>
              </span>
              <p>집 구조를 넣으면 여기에 지도가 그려져요</p>
              <div class="empty-actions">
                <button id="empty-open-house" type="button" class="primary">집 구조 입력</button>
                <button id="empty-demo" type="button" class="btn-soft">예시로 보기</button>
              </div>
            </div>
          </div>
        </div>
        <!-- 행동 자막: 영화 자막처럼 지도 아래쪽에 -->
        <div id="subtitles" class="subtitles" aria-live="polite"></div>
        <!-- 층 이동·시간 건너뛰기 때 잠깐 뜨는 전환 카드 -->
        <div id="map-transition" class="map-transition" aria-live="polite">
          <span id="map-transition-text" class="transition-card"></span>
        </div>
      </div>

      <div class="player">
        <div class="player-main">
          <div class="transport">
            <button id="btn-first" type="button" class="icon" aria-label="처음" title="처음 (Home)" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 5v14M18 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-prev" type="button" class="icon" aria-label="이전" title="이전 (←)" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="btn-play" type="button" class="play primary" aria-label="자동 재생" title="자동 재생 (Space)" disabled></button>
            <button id="btn-next" type="button" class="icon" aria-label="다음" title="다음 (→)" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <input id="slider" type="range" min="0" max="0" value="0" step="1" disabled aria-label="진행">
          <div class="clock">
            <span id="status-time" class="status-time">--:--</span>
            <span id="status-step" class="status-step">0 / 0</span>
          </div>
        </div>
        <div class="player-sub">
          <div class="options">
            <label class="select-wrap">속도
              <select id="speed">
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="2">2×</option>
                <option value="4">4×</option>
              </select>
            </label>
            <label class="switch"><input id="opt-animate" type="checkbox" checked><span class="track"></span>애니메이션</label>
            <label class="switch"><input id="opt-autoscroll" type="checkbox" checked><span class="track"></span>자동 스크롤</label>
          </div>
        </div>
      </div>
    </section>

    <section class="card timetable-card">
      <div class="card-head">
        <div class="card-title">
          <h2>시간표</h2>
          <span id="event-count" class="card-meta"></span>
        </div>
      </div>
      <div id="timetable-wrap" class="timetable-wrap">
        <table class="timetable">
          <thead>
            <tr><th>시간</th><th>캐릭터</th><th>행동</th></tr>
          </thead>
          <tbody id="timetable-body"></tbody>
        </table>
        <div id="timetable-empty" class="empty">동선을 생성하면 시간표가 표시돼요</div>
      </div>
    </section>
  </main>

  <script src="js/example.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
